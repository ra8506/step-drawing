name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Work out version and whether to release
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path stepdraw\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          # Release when main carries a version that has no release yet (bump __version__ to ship).
          $release = "false"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            gh release view "v$v" -R "${{ github.repository }}" 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $release = "true" }
          }
          "release=$release" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "version $v, release $release"
          $global:LASTEXITCODE = 0
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append $env:GITHUB_PATH
      - name: Build
        timeout-minutes: 30
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - name: Test installer (silent install, then run installed app headless)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*Setup.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOLAUNCH" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "installer timed out" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\STEP Drawing"
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$dir\python\python.exe" -m stepdraw --cli "$dir\samples\plate.step" -o "$env:RUNNER_TEMP\installed.pdf"
          if (-not (Test-Path "$env:RUNNER_TEMP\installed.pdf")) { throw "installed app failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: STEP-Drawing-Setup
          path: dist/*Setup.exe
      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: STEP Drawing ${{ steps.ver.outputs.version }}
          files: dist/*Setup.exe
          generate_release_notes: true
